AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PHYTOGUARD authenticated transport job API and private web hosting
Parameters:
  ProjectName: { Type: String, Default: phytoguard }
  MonthlyBudgetUsd: { Type: Number, Default: 20 }
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        QUEUE_URL: !Ref JobQueue
Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: { Name: !Sub '${ProjectName}-oac', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins: [{ Id: web, DomainName: !GetAtt WebBucket.RegionalDomainName, OriginAccessControlId: !Ref OriginAccessControl, S3OriginConfig: { OriginAccessIdentity: '' } }]
        DefaultCacheBehavior: { TargetOriginId: web, ViewerProtocolPolicy: redirect-to-https, AllowedMethods: [GET, HEAD, OPTIONS], CachedMethods: [GET, HEAD, OPTIONS], ForwardedValues: { QueryString: false } }
        CustomErrorResponses: [{ ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }]
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: cloudfront.amazonaws.com }, Action: s3:GetObject, Resource: !Sub '${WebBucket.Arn}/*', Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } } }]
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties: { UserPoolName: !Sub '${ProjectName}-users', AutoVerifiedAttributes: [email], DeletionProtection: INACTIVE }
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties: { UserPoolId: !Ref UserPool, GenerateSecret: false, ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH] }
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration: { AllowOrigins: ['*'], AllowHeaders: [authorization, content-type], AllowMethods: [GET, POST, OPTIONS] }
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration: { issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}', audience: [!Ref UserPoolClient] }
        DefaultAuthorizer: CognitoAuthorizer
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: ownerJob, AttributeType: S }]
      KeySchema: [{ AttributeName: ownerJob, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      SSESpecification: { SSEEnabled: true }
  JobQueue:
    Type: AWS::SQS::Queue
    Properties: { VisibilityTimeout: 180, MessageRetentionPeriod: 86400, SqsManagedSseEnabled: true }
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: api.handler
      Policies: [DynamoDBCrudPolicy: { TableName: !Ref JobsTable }, SQSSendMessagePolicy: { QueueName: !GetAtt JobQueue.QueueName }]
      Events:
        Create: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /jobs, Method: POST } }
        Get: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: '/jobs/{id}', Method: GET } }
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: worker.handler
      Timeout: 120
      ReservedConcurrentExecutions: 2
      Policies: [DynamoDBCrudPolicy: { TableName: !Ref JobsTable }]
      Events: { Queue: { Type: SQS, Properties: { Queue: !GetAtt JobQueue.Arn, BatchSize: 1 } } }
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget: { BudgetName: !Sub '${ProjectName}-monthly-cap', BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }, TimeUnit: MONTHLY, BudgetType: COST }
Outputs:
  WebUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  WebBucketName: { Value: !Ref WebBucket }
  ApiUrl: { Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
